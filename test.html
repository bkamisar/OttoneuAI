<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ottoneu Shared.js Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #ccc; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; font-weight: bold; }
    .section { margin-top: 20px; color: #90caf9; font-size: 1.1em; }
    #summary { margin-top: 20px; font-size: 1.2em; }
  </style>
</head>
<body>
  <h2>shared.js Test Suite</h2>
  <div id="output"></div>
  <div id="summary"></div>
  <script src="shared.js"></script>
  <script src="hotboard.js"></script>
  <script src="tradefinder.js"></script>
  <script>
    let passed = 0, failed = 0;
    const out = document.getElementById('output');

    function section(name) {
      const d = document.createElement('div');
      d.className = 'section';
      d.textContent = '── ' + name + ' ──';
      out.appendChild(d);
    }

    function assert(condition, name, detail) {
      const d = document.createElement('div');
      if (condition) {
        passed++;
        d.className = 'pass';
        d.textContent = '✓ ' + name;
      } else {
        failed++;
        d.className = 'fail';
        d.textContent = '✗ ' + name + (detail ? ': ' + detail : '');
      }
      out.appendChild(d);
    }

    function assertEqual(actual, expected, name) {
      const ok = JSON.stringify(actual) === JSON.stringify(expected);
      assert(ok, name, ok ? '' : 'got ' + JSON.stringify(actual) + ', want ' + JSON.stringify(expected));
    }

    // ── Tests ────────────────────────────────────────────────────────────────
    section('Scaffold');
    assert(typeof CATS !== 'undefined', 'CATS constant defined');
    assert(CATS.length === 8, 'CATS has 8 categories');
    assert(LOWER_BETTER.has('ERA'), 'ERA is lower-better');
    assert(!LOWER_BETTER.has('HR'), 'HR is not lower-better');

    section('esc()');
    assertEqual(esc('<script>'), '&lt;script&gt;', 'esc: escapes angle brackets');
    assertEqual(esc('"hello"'), '&quot;hello&quot;', 'esc: escapes quotes');
    assertEqual(esc(null), '', 'esc: handles null');
    assertEqual(esc(0), '0', 'esc: handles numeric zero');

    section('CSV Parser');
    const csvSample = 'Name,HR,OBP\n"Judge, Aaron",62,0.400\nTrout,40,0.390';
    const csvRows = parseCSV(csvSample);
    assertEqual(csvRows.length, 2, 'parseCSV: correct row count');
    assertEqual(csvRows[0]['Name'], 'Judge, Aaron', 'parseCSV: handles quoted commas');
    assertEqual(csvRows[0]['HR'], '62', 'parseCSV: reads numeric field as string');
    assertEqual(csvRows[1]['OBP'], '0.390', 'parseCSV: reads last field');

    section('localStorage');
    saveData('_test_key', { x: 42 });
    assertEqual(loadData('_test_key'), { x: 42 }, 'saveData/loadData roundtrip');
    localStorage.removeItem('_test_key');
    assertEqual(loadData('_test_key'), null, 'loadData returns null for missing key');

    section('Roster Parser');
    const rosterCSV =
      'FG MajorLeagueID,Name,Position(s),Salary,Team Name\n' +
      '12345,Aaron Judge,OF,$36,My Team\n' +
      '67890,Shohei Ohtani,DH/OF,$75,Other Team\n' +
      '11111,Gerrit Cole,SP,$40,My Team\n' +
      ',Unknown Player,1B,$1,';

    const roster = parseRosterCSV(rosterCSV);
    assertEqual(roster.length, 4, 'parseRosterCSV: row count');
    assertEqual(roster[0].fgId, '12345', 'parseRosterCSV: fgId');
    assertEqual(roster[0].salary, 36, 'parseRosterCSV: strips $ from salary');
    assertEqual(roster[0].type, 'H', 'parseRosterCSV: hitter type');
    assertEqual(roster[2].type, 'P', 'parseRosterCSV: pitcher type');
    assertEqual(roster[1].positions, ['dh','of'], 'parseRosterCSV: splits positions');
    assertEqual(roster[3].team, 'Free Agent', 'parseRosterCSV: blank team → Free Agent');
    assertEqual(normalizeName('José Ramírez'), 'jose ramirez', 'normalizeName: strips accents');

    section('Projection Parsers');
    const hitProjCSV =
      'playerid,Name,Team,PA,AB,H,BB,HBP,HR,R,OBP,SLG\n' +
      '12345,Aaron Judge,NYY,600,520,150,90,5,55,110,0.400,0.580\n' +
      '00000,Zero PA Guy,AAA,0,0,0,0,0,0,0,0,0';

    const hitProj = parseHittingProjections(hitProjCSV);
    assertEqual(hitProj.length, 1, 'parseHittingProjections: filters zero-PA rows');
    assertEqual(hitProj[0].proj.hr, 55, 'parseHittingProjections: HR');
    assertEqual(hitProj[0].proj.obp, 0.400, 'parseHittingProjections: OBP');
    assertEqual(hitProj[0].type, 'H', 'parseHittingProjections: type is H');

    const pitProjCSV =
      'playerid,Name,Team,IP,H,BB,HR,SO,ERA,WHIP,HR/9\n' +
      '99999,Gerrit Cole,NYY,200,160,40,20,240,3.00,1.00,0.90';

    const pitProj = parsePitchingProjections(pitProjCSV);
    assertEqual(pitProj.length, 1, 'parsePitchingProjections: row count');
    assertEqual(pitProj[0].proj.ip, 200, 'parsePitchingProjections: IP');
    assertEqual(pitProj[0].proj.so, 240, 'parsePitchingProjections: SO');
    assert(Math.abs(pitProj[0].proj.er - 200 * 3.00 / 9) < 0.01,
      'parsePitchingProjections: derived ER');

    const pitProjNoHR9CSV =
      'playerid,Name,Team,IP,H,BB,HR,SO,ERA,WHIP,HR/9\n' +
      '88888,No HR9 Pitcher,NYY,180,160,50,18,200,3.50,1.10,0';
    const pitProjNoHR9 = parsePitchingProjections(pitProjNoHR9CSV);
    assert(Math.abs(pitProjNoHR9[0].proj.hr9 - (18 * 9 / 180)) < 0.001,
      'parsePitchingProjections: derives HR/9 when column is zero');

    section('Player Matching');
    const rPlayers = [
      { fgId: '111', name: 'mike trout',    rawName: 'Mike Trout',    type: 'H', positions: ['of'], salary: 30, team: 'My Team' },
      { fgId: '',    name: 'nolan arenado', rawName: 'Nolan Arenado', type: 'H', positions: ['3b'], salary: 20, team: 'Other'   },
    ];
    const hProj = [
      { fgId: '111', name: 'mike trout',    type: 'H', proj: { pa:550, ab:490, h:140, bb:85, hbp:5, hr:35, r:100, obp:0.420, slg:0.580 } },
      { fgId: '222', name: 'nolan arenado', type: 'H', proj: { pa:580, ab:530, h:160, bb:45, hbp:3, hr:28, r:85,  obp:0.350, slg:0.510 } },
    ];
    const matched = matchPlayers(rPlayers, hProj, []);
    assertEqual(matched[0].proj.hr, 35, 'matchPlayers: matches by fgId');
    assertEqual(matched[1].proj.hr, 28, 'matchPlayers: falls back to name match');
    assertEqual(matched[0].team, 'My Team', 'matchPlayers: preserves roster fields');
    assertEqual(matched[0].salary, 30, 'matchPlayers: preserves salary');

    section('Lineup Optimizer');
    function mkH(name, positions, pa, obp, slg) {
      const proj = { pa, ab: pa*0.88, h: pa*0.25, bb: pa*0.10, hbp: pa*0.01, hr: pa*0.05, r: pa*0.14, obp, slg };
      return { fgId: name, name, rawName: name, type: 'H', positions, proj, stats: null, salary: 10, team: 'T' };
    }
    const testHitters = [
      mkH('catcher',   ['c'],       400, 0.330, 0.460),
      mkH('firstbase', ['1b'],      550, 0.360, 0.520),
      mkH('second',    ['2b'],      520, 0.340, 0.470),
      mkH('short',     ['ss'],      510, 0.345, 0.465),
      mkH('third',     ['3b'],      540, 0.350, 0.500),
      mkH('midual',    ['2b','ss'], 580, 0.370, 0.530),
      mkH('of1',       ['of'],      600, 0.400, 0.600),
      mkH('of2',       ['of'],      590, 0.390, 0.580),
      mkH('of3',       ['of'],      570, 0.380, 0.560),
      mkH('of4',       ['of'],      560, 0.375, 0.550),
      mkH('of5',       ['of'],      550, 0.365, 0.540),
      mkH('dh',        ['dh'],      530, 0.355, 0.495),
    ];
    const lu = optimizeHitterLineup(testHitters);
    assert(lu['C']  && lu['C'].name  === 'catcher',  'optimizer: C assigned to catcher');
    assert(lu['1B'] && lu['1B'].name === 'firstbase', 'optimizer: 1B assigned');
    assert(lu['MI'] !== undefined,                    'optimizer: MI slot filled');
    assert(lu['MI'].positions.includes('2b') || lu['MI'].positions.includes('ss'),
      'optimizer: MI player is MI-eligible');
    assert(['OF1','OF2','OF3','OF4','OF5'].every(s => lu[s]), 'optimizer: all 5 OF slots filled');
    assert(lu['UTIL'] !== undefined, 'optimizer: UTIL filled');
    const names = Object.values(lu).map(p => p.name);
    assertEqual(names.length, new Set(names).size, 'optimizer: no duplicate assignments');

    section('Scoring Engine');
    function mkSH(name, pa, obp, slg, hr, r) {
      const proj = { pa, ab: pa*0.88, obp, slg, hr, r };
      return { fgId: name, name, type: 'H', positions: ['of'], proj, salary: 0, team: 'T' };
    }
    function mkSP(name, ip, era, whip, hr9, so) {
      const proj = { ip, era, whip, hr9, so };
      return { fgId: name, name, type: 'P', positions: ['sp'], proj, salary: 0, team: 'T' };
    }
    const testLineup   = { OF1: mkSH('h1',600,0.380,0.540,35,95), OF2: mkSH('h2',550,0.360,0.500,25,80) };
    const testPitchers = [ mkSP('p1',800,3.20,1.10,1.00,220), mkSP('p2',700,3.80,1.20,1.20,180) ];
    const ts = computeTeamStats(testLineup, testPitchers);
    assert(ts._pitchingValid, 'scoring: pitching valid when IP >= 1250');
    assertEqual(ts.HR, 60, 'scoring: HR sums correctly');
    assertEqual(ts.R,  175, 'scoring: R sums correctly');
    assert(ts.OBP > 0.36 && ts.OBP < 0.38, 'scoring: OBP is weighted average');

    const teams2 = [
      { name: 'A', stats: { OBP:0.380, SLG:0.540, HR:200, R:900, ERA:3.50, WHIP:1.20, HR9:1.10, SO:1400 } },
      { name: 'B', stats: { OBP:0.360, SLG:0.510, HR:180, R:850, ERA:4.00, WHIP:1.30, HR9:1.30, SO:1300 } },
    ];
    const standings = buildStandings(teams2);
    assertEqual(standings[0].name, 'A', 'standings: better team ranks first');
    assert(standings[0].ranks['ERA'] > standings[1].ranks['ERA'],
      'standings: lower ERA gets higher points');

    section('Valuation Model');
    function mkFull(id, name, type, pos, proj, salary, team) {
      return { fgId: id, name, rawName: name, type, positions: pos, salary, team, proj, stats: null };
    }
    function padPitchers(arr, teamName) {
      for (let i = arr.length; i < 10; i++)
        arr.push(mkFull(teamName+'p'+i, teamName+'p'+i, 'P', ['sp'],
          { ip:100, h:95, bb:35, hr:10, so:110, era:3.60, whip:1.30, hr9:0.90, er:40 }, 4, teamName));
    }
    const t1 = [
      mkFull('s1','star','H',['of'],{ pa:600,ab:540,h:162,bb:70,hbp:5,hr:45,r:110,obp:0.420,slg:0.600 },30,'T1'),
      mkFull('w1','weak','H',['ss'],{ pa:460,ab:415,h:110,bb:35,hbp:2,hr:10,r:55, obp:0.310,slg:0.400 },5, 'T1'),
      mkFull('p1','ace', 'P',['sp'],{ ip:220,h:170,bb:45,hr:18,so:260,era:2.90,whip:0.98,hr9:0.74,er:71 },30,'T1'),
    ];
    const t2 = [
      mkFull('s2','avg', 'H',['of'],{ pa:500,ab:450,h:125,bb:45,hbp:4,hr:18,r:65, obp:0.340,slg:0.450 },8, 'T2'),
      mkFull('w2','poor','H',['c'], { pa:350,ab:315,h:80, bb:25,hbp:2,hr:8, r:35, obp:0.290,slg:0.370 },4, 'T2'),
      mkFull('p2','mid', 'P',['sp'],{ ip:160,h:170,bb:60,hr:25,so:155,era:4.20,whip:1.44,hr9:1.41,er:75 },10,'T2'),
    ];
    padPitchers(t1, 'T1');
    padPitchers(t2, 'T2');

    const vm = calculateAllValues([t1, t2]);
    assert(vm['s1'] !== undefined, 'valuation: star hitter has entry');
    assert((vm['s1'].projectedValue || 0) > (vm['w2'].projectedValue || 0),
      'valuation: star hitter valued above poor hitter');
    assert(vm['s1'].surplus < vm['s1'].projectedValue, 'valuation: surplus = value - salary');

    // Dynamic H/P split: when pitching is invalid (low IP), all dollars go to hitters.
    // Use distinct player keys per team so replacement level is set by the weaker team.
    const dStar = mkFull('dStar','dstar','H',['of'],{ pa:600,ab:540,h:162,bb:70,hbp:5,hr:45,r:110,obp:0.420,slg:0.600 },0,'D1');
    const dRepl = mkFull('dRepl','drepl','H',['of'],{ pa:300,ab:270,h:67, bb:25,hbp:2,hr:8, r:35, obp:0.310,slg:0.380 },0,'D2');
    const dPit1 = mkFull('dPit1','dpit1','P',['sp'],{ ip:1000,h:800,bb:250,hr:80,so:600,era:4.24,whip:1.28,hr9:1.15,er:471 },0,'D1');
    const dPit2 = mkFull('dPit2','dpit2','P',['sp'],{ ip:1000,h:800,bb:250,hr:80,so:600,era:4.24,whip:1.28,hr9:1.15,er:471 },0,'D2');
    const vmDynamic = calculateAllValues([[dStar, dPit1], [dRepl, dPit2]]);
    assert(typeof vmDynamic !== 'undefined', 'dynamic split: calculateAllValues returns a value map');
    // Pitching is invalid (1000 IP < IP_MIN 1250) so all dollars go to hitters.
    // Star should have positive value above the weaker replacement-level OF.
    assert((vmDynamic['dStar'] || {}).projectedValue > 0, 'dynamic split: star hitter has positive value when pitching SGP is zero');

    section('Proration');
    const factor = rosProrationFactor();
    assert(factor >= 0 && factor <= 1, 'rosProrationFactor: returns value between 0 and 1');
    const today2 = new Date();
    const mayStart = new Date(today2.getFullYear(), 4, 1);
    const mayEnd   = new Date(today2.getFullYear(), 4, 31);
    if (today2 >= mayStart && today2 <= mayEnd) {
      assert(factor > 0.45 && factor < 0.75, 'rosProrationFactor: mid-May factor is reasonable (~0.55)');
    }

    section('Repo Auto-Load');
    assert(typeof REPO_FILES !== 'undefined', 'REPO_FILES: defined');
    assert(Array.isArray(REPO_FILES), 'REPO_FILES: is an array');
    assert(REPO_FILES.length === 9, 'REPO_FILES: has 9 entries');
    REPO_FILES.forEach(function(entry, i) {
      assert(typeof entry.file  === 'string',   'REPO_FILES[' + i + ']: has file string');
      assert(typeof entry.key   === 'string',   'REPO_FILES[' + i + ']: has key string');
      assert(typeof entry.parse === 'function', 'REPO_FILES[' + i + ']: has parse function');
    });
    assert(typeof autoLoadFromRepo === 'function', 'autoLoadFromRepo: defined as function');
    var p = autoLoadFromRepo();
    assert(p instanceof Promise, 'autoLoadFromRepo: returns a Promise');
    assert(REPO_FILES[0].file === 'roster.csv',           'REPO_FILES[0]: roster.csv');
    assert(REPO_FILES[1].file === 'proj_hitting.csv',     'REPO_FILES[1]: proj_hitting.csv');
    assert(REPO_FILES[2].file === 'proj_pitching.csv',    'REPO_FILES[2]: proj_pitching.csv');
    assert(REPO_FILES[3].file === 'proj_hitting_y1.csv',  'REPO_FILES[3]: proj_hitting_y1.csv');

    // ── hotboard: role + thresholds ──────────────────────────────────────────
    section('Hot Board — thresholds & role');
    assertEqual(hotClassifyRole(4, 4), 'SP', 'hotClassifyRole: all starts → SP');
    assertEqual(hotClassifyRole(5, 2), 'RP', 'hotClassifyRole: mostly relief → RP');
    assertEqual(hotClassifyRole(4, 2), 'SP', 'hotClassifyRole: half starts → SP');
    assertEqual(hotClassifyRole(6, 0), 'RP', 'hotClassifyRole: no starts → RP');
    assert(hotMeetsThreshold('H', 15, { pa: 25 }), 'hotMeetsThreshold: hitter at PA gate passes');
    assert(!hotMeetsThreshold('H', 15, { pa: 24 }), 'hotMeetsThreshold: hitter under PA gate fails');
    assert(hotMeetsThreshold('SP', 7, { gs: 1 }), 'hotMeetsThreshold: SP at start gate passes');
    assert(!hotMeetsThreshold('RP', 30, { g: 7 }), 'hotMeetsThreshold: RP under appearance gate fails');
    assert(!hotMeetsThreshold('H', 15, null), 'hotMeetsThreshold: null line fails');

    // ── hotboard: HotScore ───────────────────────────────────────────────────
    section('Hot Board — HotScore');
    var hpool = [
      { obp: 0.330, slg: 0.430, hr: 4, r: 11 },
      { obp: 0.290, slg: 0.370, hr: 2, r: 7 },
      { obp: 0.370, slg: 0.490, hr: 6, r: 15 }
    ];
    var hstats = hotPoolStats(hpool, ['obp', 'slg', 'hr', 'r']);
    assert(Math.abs(hstats.obp.mean - 0.330) < 1e-9, 'hotPoolStats: mean OBP');
    var hot = hotScoreFor({ obp: 0.400, slg: 0.620, hr: 7, r: 15 }, hstats, 'H');
    var avg = hotScoreFor({ obp: 0.330, slg: 0.430, hr: 4, r: 11 }, hstats, 'H');
    assert(hot > avg, 'hotScoreFor: hot hitter beats average hitter');
    assert(Math.abs(avg) < 0.5, 'hotScoreFor: average-ish line near zero');
    var ppool = [
      { so: 20, hr9: 1.0, era: 3.50, whip: 1.10 },
      { so: 10, hr9: 1.5, era: 5.00, whip: 1.40 }
    ];
    var pstats = hotPoolStats(ppool, ['so', 'hr9', 'era', 'whip']);
    var goodP = hotScoreFor({ so: 20, hr9: 1.0, era: 3.50, whip: 1.10 }, pstats, 'P');
    var badP  = hotScoreFor({ so: 10, hr9: 1.5, era: 5.00, whip: 1.40 }, pstats, 'P');
    assert(goodP > badP, 'hotScoreFor: strong pitcher beats weak pitcher');
    var flat = hotPoolStats([{ hr: 3 }, { hr: 3 }], ['hr']);
    assert(isFinite(hotScoreFor({ hr: 3 }, flat, 'H')), 'hotScoreFor: no NaN on flat category');

    // ── hotboard: breakout + FA matching ─────────────────────────────────────
    section('Hot Board — breakout & FA matching');
    assert(hotBreakoutBadge('H', { obp: 0.400, slg: 0.560 }, { obp: 0.340, slg: 0.470 }),
      'hotBreakoutBadge: hitter well over proj → true');
    assert(!hotBreakoutBadge('H', { obp: 0.330, slg: 0.440 }, { obp: 0.340, slg: 0.470 }),
      'hotBreakoutBadge: hitter under proj → false');
    assert(!hotBreakoutBadge('H', { obp: 0.400, slg: 0.560 }, null),
      'hotBreakoutBadge: no projection → false');
    assert(hotBreakoutBadge('P', { era: 2.10, whip: 0.90 }, { era: 3.80, whip: 1.25 }),
      'hotBreakoutBadge: pitcher ERA+WHIP both better → true');
    assert(!hotBreakoutBadge('P', { era: 2.10, whip: 1.40 }, { era: 3.80, whip: 1.25 }),
      'hotBreakoutBadge: pitcher WHIP worse → false (ERA-only not enough)');
    var rset = hotRosteredSet([{ name: 'Aaron Judge' }, { name: 'José Ramírez' }]);
    assert(!hotIsFreeAgent('Aaron Judge', rset), 'hotIsFreeAgent: rostered → false');
    assert(hotIsFreeAgent('Some Prospect', rset), 'hotIsFreeAgent: unrostered → true');
    assert(!hotIsFreeAgent('Jose Ramirez', rset), 'hotIsFreeAgent: accent-insensitive match');

    // ── Option-valued contracts ──────────────────────────────────────────────
    section('Contract horizons');
    // Cheap productive player: keeping all three years is clearly best.
    var cheap = computeContractHorizon(20, 22, 21, 5, 0.90, 0.81, 0);
    assertEqual(cheap.holdHorizon, 2, 'horizon: cheap productive contract → keeper (H2)');
    assert(cheap.dynastySurplus > 35, 'horizon: cheap contract surplus is large positive');

    // Productive but overpaid: renting beats holding. The spec's worked example.
    var rental = computeContractHorizon(12, 18, 15, 30, 0.90, 0.81, 0);
    assertEqual(rental.holdHorizon, 0, 'horizon: overpaid productive → rental (H0)');
    assert(Math.abs(rental.dynastySurplus - (-18)) < 0.01,
      'horizon: rental surplus = -18 (was -46 under forced 3-year hold)');
    assertEqual(rental.dynastyValue, 12, 'horizon: rental value is Y0 only');
    assert(Math.abs(rental.dynastyCost - 30) < 0.01,
      'horizon: rental cost is the full season salary, NOT prorated');

    // Overpaid AND unproductive: negative at every horizon; max is still negative.
    var bad = computeContractHorizon(2, 3, 2, 25, 0.90, 0.81, 0);
    assert(bad.dynastySurplus < 0, 'horizon: genuinely bad contract stays negative');
    assertEqual(bad.holdHorizon, 0, 'horizon: bad contract cuts at earliest horizon');

    // Prospect floor applies to the long horizon and wins there (invariant #6).
    var prospect = computeContractHorizon(0, 2, 3, 1, 0.90, 0.81, 45);
    assertEqual(prospect.holdHorizon, 2, 'horizon: prospect floor → keeper (H2)');
    assertEqual(prospect.dynastyValue, 45, 'horizon: prospect floor becomes the H2 value');

    // Value and cost must always describe the SAME horizon.
    [cheap, rental, bad, prospect].forEach(function (h, i) {
      assert(Math.abs((h.dynastyValue - h.dynastyCost) - h.dynastySurplus) < 1e-9,
        'horizon: value-cost-surplus internally consistent (case ' + i + ')');
    });

    // Salary floor: a $0 salary is treated as $1, never free.
    var freebie = computeContractHorizon(10, 10, 10, 0, 0.90, 0.81, 0);
    assert(freebie.dynastyCost > 0, 'horizon: zero salary floors to $1, cost is positive');

    // ── tradefinder: marginal delta ──────────────────────────────────────────
    section('Marginal value');
    var tfDen = { OBP: 0.010, SLG: 0.020, HR: 10, R: 40, ERA: 0.20, WHIP: 0.040, HR9: 0.10, SO: 80 };
    var tfBase = { OBP: 0.330, SLG: 0.430, HR: 200, R: 700, ERA: 3.80, WHIP: 1.200, HR9: 1.10, SO: 1300,
                   _pitchingValid: true };

    // Removing a hitter lowers HR/R → the player's marginal contribution is positive.
    var tfCutHitter = { OBP: 0.330, SLG: 0.430, HR: 180, R: 660, ERA: 3.80, WHIP: 1.200, HR9: 1.10, SO: 1300,
                        _pitchingValid: true };
    assert(tfMarginalZ(tfBase, tfCutHitter, tfDen) > 0, 'tfMarginalZ: removing a productive hitter → positive marginal');

    // A player whose removal changes nothing is worth nothing to that roster.
    assertEqual(tfMarginalZ(tfBase, tfBase, tfDen), 0, 'tfMarginalZ: blocked player (no change) → zero marginal');

    // ERA is lower-better: base 3.80 vs cut 4.00 means the player IMPROVED the
    // team ERA, so his marginal must be positive.
    var tfCutPitcher = { OBP: 0.330, SLG: 0.430, HR: 200, R: 700, ERA: 4.00, WHIP: 1.200, HR9: 1.10, SO: 1300,
                         _pitchingValid: true };
    assert(tfMarginalZ(tfBase, tfCutPitcher, tfDen) > 0, 'tfMarginalZ: lower-better ERA handled with correct sign');

    // A player who actively hurts the team scores negative.
    var tfCutBad = { OBP: 0.330, SLG: 0.430, HR: 210, R: 720, ERA: 3.80, WHIP: 1.200, HR9: 1.10, SO: 1300,
                     _pitchingValid: true };
    assert(tfMarginalZ(tfBase, tfCutBad, tfDen) < 0, 'tfMarginalZ: removing him IMPROVES the team → negative marginal');

    // Pitching-validity flip must not emit a phantom gain.
    var tfCutInvalid = { OBP: 0.330, SLG: 0.430, HR: 180, R: 660, ERA: 0, WHIP: 0, HR9: 0, SO: 0,
                         _pitchingValid: false };
    var tfZFlip = tfMarginalZ(tfBase, tfCutInvalid, tfDen);
    var tfZHitOnly = tfMarginalZ(
      { OBP: 0.330, SLG: 0.430, HR: 200, R: 700, _pitchingValid: true },
      { OBP: 0.330, SLG: 0.430, HR: 180, R: 660, _pitchingValid: true },
      tfDen);
    assert(Math.abs(tfZFlip - tfZHitOnly) < 1e-9,
      'tfMarginalZ: pitching-validity flip skips pitching cats, no phantom delta');

    // Fixture roster: 3 clearly-better outfielders plus a blocked 4th.
    function tfHit(name, obp, slg, hr, r) {
      return { name: name, fgId: name, type: 'H', positions: ['of'],
               proj: { pa: 600, ab: 540, obp: obp, slg: slg, hr: hr, r: r } };
    }
    var tfStar1 = tfHit('Star One',   0.400, 0.560, 40, 100);
    var tfStar2 = tfHit('Star Two',   0.390, 0.550, 38, 98);
    var tfStar3 = tfHit('Star Three', 0.385, 0.545, 36, 96);
    var tfScrub = tfHit('Blocked Guy', 0.300, 0.350, 5, 30);
    // These players are OF-only, so they can fill just OF1-5 + UTIL = 6 slots
    // (C/1B/2B/SS/3B/MI require other eligibility and stay empty). 15 players
    // rank ahead of the scrub, so he is guaranteed not to start.
    var tfFill = [];
    for (var tfi = 0; tfi < 12; tfi++) tfFill.push(tfHit('Filler ' + tfi, 0.360, 0.480, 25, 80));
    var tfRoster = [tfStar1, tfStar2, tfStar3].concat(tfFill).concat([tfScrub]);
    var tfMarg = tfRosterMarginals(tfRoster, tfDen, 400);

    assert(tfMarg['Blocked Guy'] === 0,
      'tfRosterMarginals: player who never cracks the lineup has zero marginal');
    assert(tfMarg['Star One'] > 0,
      'tfRosterMarginals: a starter has positive marginal value');

    // Blockedness: the scrub strands whatever absolute value he carries.
    var tfVals = { 'Blocked Guy': { projectedValue: 12 }, 'Star One': { projectedValue: 40 } };
    assertEqual(tfBlockedness(tfScrub, tfMarg, tfVals), 12,
      'tfBlockedness: blocked player strands his full absolute value');
    assert(tfBlockedness(tfStar1, tfMarg, tfVals) < 40,
      'tfBlockedness: a starter strands less than his absolute value');

    // Gain: worth more to a team that would actually start him.
    var tfThin = { 'Blocked Guy': 9 };
    assertEqual(tfGain(tfScrub, tfMarg, tfThin), 9,
      'tfGain: blocked here, valuable there → positive gain');

    // Two identical teams plus one with a hole at catcher.
    function tfC(name, obp, slg, hr, r) {
      var p = tfHit(name, obp, slg, hr, r); p.positions = ['c']; return p;
    }
    function tfTeam(prefix, catcher) {
      var arr = [catcher];
      for (var i = 0; i < 12; i++) arr.push(tfHit(prefix + ' OF' + i, 0.360, 0.480, 25, 80));
      return arr;
    }
    var tfRostersByTeam = {
      Alpha: tfTeam('A', tfC('A C', 0.370, 0.500, 28, 85)),
      Bravo: tfTeam('B', tfC('B C', 0.370, 0.500, 28, 85)),
      Delta: tfTeam('D', tfC('D C', 0.270, 0.300, 2, 20)),   // the hole
    };
    var tfAll = tfAllMarginals(tfRostersByTeam, tfDen, 400);
    var tfGaps = tfNeedGaps(tfRostersByTeam, tfAll);

    assert(tfGaps.Delta.C > tfGaps.Alpha.C,
      'tfNeedGaps: the team with a weak catcher shows the larger gap at C');
    assert(Math.abs(tfGaps.Alpha.C) < 0.01,
      'tfNeedGaps: a median-strength slot shows ~zero gap');
    assert(typeof TF_BLOCK_MIN === 'number' && typeof TF_NEED_MIN === 'number' &&
           typeof TF_GAIN_MIN === 'number', 'tradefinder: tunable thresholds exported');

    // ── PA-budget lineup: rate key + scaling ─────────────────────────────────
    section('PA budget');
    var paJudge = { name: 'judge', type: 'H', positions: ['of'], proj: { pa: 97,  ab: 85,  obp: 0.420, slg: 0.551, hr: 8, r: 15 } };
    var paRaf   = { name: 'raf',   type: 'H', positions: ['of'], proj: { pa: 213, ab: 195, obp: 0.300, slg: 0.411, hr: 6, r: 22 } };
    assert(hitterRateValue(paJudge, 45) > hitterRateValue(paRaf, 45),
      'hitterRateValue: injured star outranks healthy mediocrity');

    // The league scores HR and R: a power/R profile must beat an empty-OPS profile
    // that raw OPS would prefer. (Perez-vs-Arraez shape.)
    var paPower = { name: 'power', type: 'H', positions: ['c'], proj: { pa: 400, ab: 370, obp: 0.310, slg: 0.470, hr: 20, r: 44 } };
    var paEmpty = { name: 'empty', type: 'H', positions: ['c'], proj: { pa: 400, ab: 360, obp: 0.350, slg: 0.450, hr: 4,  r: 40 } };
    assert(((paEmpty.proj.obp + paEmpty.proj.slg) > (paPower.proj.obp + paPower.proj.slg)),
      'fixture check: OPS actually prefers the empty profile');
    assert(hitterRateValue(paPower, 45) > hitterRateValue(paEmpty, 45),
      'hitterRateValue: z-weights prefer the power/R profile OPS misses');

    var paFluke = { name: 'fluke', type: 'H', positions: ['of'], proj: { pa: 1, ab: 1, obp: 0.500, slg: 0.900, hr: 1, r: 1 } };
    assert(hitterRateValue(paFluke, 45) < hitterRateValue(paRaf, 45),
      'hitterRateValue: a 1-PA fluke is ramped below a real regular');

    var paScaled = scaleHitterUsage(paRaf, 100);
    assertEqual(paScaled._proj.pa, 100, 'scaleHitterUsage: PA set to the used amount');
    assertEqual(paScaled._proj.obp, 0.300, 'scaleHitterUsage: rate stats unchanged');
    assert(Math.abs(paScaled._proj.r - 22 * (100 / 213)) < 1e-9,
      'scaleHitterUsage: counting stats scale by the used fraction');
    assert(scaleHitterUsage(paRaf, 500) === paRaf,
      'scaleHitterUsage: asking for more than projected returns the player untouched');
    assert(paSlotBudget() > 0, 'paSlotBudget: positive');

    // ── PA-budget lineup: supplementation ────────────────────────────────────
    function paC(name, pa, obp, slg, hr, r) {
      return { name: name, fgId: name, type: 'H', positions: ['c'],
               proj: { pa: pa, ab: pa * 0.9, obp: obp, slg: slg, hr: hr, r: r } };
    }
    // NOTE on fixtures: UTIL is eligible to ANY hitter, so with only two
    // catchers the second becomes UTIL's primary in phase 1 and never reaches
    // supplementation. Supplementation fires only for players left over after
    // all 12 primary slots are filled — hence three catchers below.
    // Injured elite + two bench catchers, budget 196.
    var paLu = optimizeHitterLineup([paC('eliteC', 97,  0.420, 0.551, 8,  15),
                                     paC('midC',  213, 0.340, 0.460, 10, 25),
                                     paC('lowC',  213, 0.300, 0.411, 6,  22)], 196);
    assertEqual(paLu['C'].name, 'eliteC', 'optimizer: elite injured bat is the PRIMARY');
    assertEqual(paLu['UTIL'].name, 'midC', 'optimizer: UTIL takes the best remaining bat as a primary');
    assert(paLu['C_2'] && paLu['C_2'].name === 'lowC', 'optimizer: leftover bat supplements the short slot');
    assert(Math.abs(paLu['C_2']._proj.pa - 99) < 1e-9, 'optimizer: backup scaled to 196−97 PA');

    // Full-timer overflows the budget: NO backup, full projection kept.
    var paLu2 = optimizeHitterLineup([paC('fullC', 250, 0.340, 0.450, 10, 30),
                                      paC('benchC', 200, 0.300, 0.400, 5, 20)], 196);
    assertEqual(paLu2['C'].name, 'fullC', 'optimizer: full-timer is primary');
    assert(!paLu2['C_2'], 'optimizer: no supplementation when the primary exceeds the budget');
    assertEqual(paLu2['C']._proj.pa, 250, 'optimizer: primary is never capped');

    // Deep shortfall loops to a third contributor (c2 goes to UTIL, so four
    // catchers are needed to leave two on the bench).
    var paLu3 = optimizeHitterLineup([paC('c1', 60,  0.380, 0.500, 5, 10),
                                      paC('c2', 60,  0.340, 0.450, 4, 9),
                                      paC('c3', 100, 0.320, 0.420, 4, 12),
                                      paC('c4', 80,  0.310, 0.410, 3, 10)], 196);
    assert(paLu3['C'] && paLu3['C_2'] && paLu3['C_3'], 'optimizer: loop supplements twice on a deep shortfall');
    var paNames3 = Object.values(paLu3).map(function (p) { return p.name; });
    assertEqual(paNames3.length, new Set(paNames3).size, 'optimizer: no duplicates across primary+backup keys');

    // Incentive check: a healthy full-timer beats an injured star + mediocre
    // backup of the same blended volume — supplementation must never make
    // rostering injuries BETTER than health.
    function paTeamZ(lu) {
      var st = computeTeamStats(lu, [], 0);
      return st.HR / 8.39 + st.R / 17.84 + st.OBP / 0.0083 + st.SLG / 0.0094;
    }
    var paHealthy = optimizeHitterLineup([paC('healthy', 196, 0.420, 0.551, 16, 30)], 196);
    var paInjured = optimizeHitterLineup([paC('star', 97, 0.420, 0.551, 8, 15),
                                          paC('bench', 99, 0.300, 0.411, 3, 10)], 196);
    assert(paTeamZ(paHealthy) >= paTeamZ(paInjured),
      'optimizer: healthy full-timer ≥ injured star + backup (no perverse incentive)');

    // A team with a supplemented slot must not create phantom needs elsewhere.
    var paGapRosters = {
      Whole:   [paC('wc1', 250, 0.340, 0.450, 10, 30)],
      Injured: [paC('ic1', 97,  0.420, 0.551, 8,  15),
                paC('ic2', 213, 0.340, 0.460, 10, 25),
                paC('ic3', 213, 0.300, 0.411, 6,  22)]
    };
    var paGapMarg = tfAllMarginals(paGapRosters, tfDen, 400);
    var paGaps2 = tfNeedGaps(paGapRosters, paGapMarg);
    assert(!Object.keys(paGaps2.Whole).some(function (s) { return s.indexOf('_') > -1; }),
      'tfNeedGaps: no derived backup keys in the gap map');
    assert(!Object.keys(paGaps2.Injured).some(function (s) { return s.indexOf('_') > -1; }),
      'tfNeedGaps: supplemented team also reports only primary slots');

    // ── Y1 rank-based replacement ────────────────────────────────────────────
    section('Future-year replacement');
    // matchPlayers snapshot captures per-type rostered counts (invariant #8 family).
    (function () {
      var sI = ROSTERED_IDS, sN = ROSTERED_NAMES, sC = ROSTERED_COUNTS, sB = FA_BASELINES;
      matchPlayers([{ fgId: 'r1', name: 'aa', type: 'H' },
                    { fgId: 'r2', name: 'bb', type: 'H' },
                    { fgId: 'r3', name: 'cc', type: 'P' }], [], []);
      assertEqual(ROSTERED_COUNTS, { H: 2, P: 1 },
        'ROSTERED_COUNTS: matchPlayers snapshots per-type rostered counts');
      ROSTERED_IDS = sI; ROSTERED_NAMES = sN; ROSTERED_COUNTS = sC; FA_BASELINES = sB;
    })();

    // Future years slice past the re-rostered boundary; Y0 slices the top of the FA pool.
    (function () {
      function hp(n, pa, obp, slg) { return { name: n, proj: { pa: pa, ab: pa * 0.9, hr: 10, r: 50, obp: obp, slg: slg } }; }
      var pool = [hp('h1',600,0.400,0.550), hp('h2',600,0.380,0.520), hp('h3',600,0.360,0.500),
                  hp('h4',600,0.340,0.470), hp('h5',600,0.320,0.440), hp('h6',600,0.300,0.410)];
      var sC = ROSTERED_COUNTS, sB = FA_BASELINES, sI = ROSTERED_IDS, sN = ROSTERED_NAMES;
      FA_BASELINES = {};
      ROSTERED_IDS = new Set(); ROSTERED_NAMES = new Set();   // nobody rostered → all are FAs
      ROSTERED_COUNTS = { H: 3, P: 3 };

      computeFABaselines(pool, [], [], 'proj_y1');
      // league re-rosters top 3, so replacement = ranks 4-6 → OBP (.340+.320+.300)/3 = .320
      assert(Math.abs(FA_BASELINES['proj_y1'].H.obp - 0.320) < 1e-9,
        'computeFABaselines: future year takes the post-reshuffle boundary cohort');

      computeFABaselines(pool, [], [], 'proj');
      // Y0 unchanged: top-of-pool cohort (all 6 are FAs, cohort cap 8) → mean OBP .350
      assert(Math.abs(FA_BASELINES['proj'].H.obp - 0.350) < 1e-9,
        'computeFABaselines: Y0 still averages the top free agents');

      ROSTERED_COUNTS = { H: 10, P: 10 };   // boundary past the end of a 6-deep pool
      computeFABaselines(pool, [], [], 'proj_y2');
      assertEqual(FA_BASELINES['proj_y2'].H, null,
        'computeFABaselines: pool thinner than the boundary yields null (fallback path)');

      ROSTERED_COUNTS = sC; FA_BASELINES = sB; ROSTERED_IDS = sI; ROSTERED_NAMES = sN;
    })();

    // ── Summary ──────────────────────────────────────────────────────────────
    const sumEl = document.getElementById('summary');
    sumEl.textContent = passed + ' passed, ' + failed + ' failed';
    sumEl.style.color = failed === 0 ? '#4caf50' : '#f44336';
  </script>
